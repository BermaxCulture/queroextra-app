info:
  name: gerartoken
  type: http

http:
  method: POST
  url: "{{base_url}}/auth/token"
  body:
    type: json
    data: |-
      {
        "grant_type": "client_credentials",
        "client_id": "{{client_id}}",
        "client_secret": "{{client_secret}}",
        "scope": "pix.cob/write wallet/write"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        if(data && data.access_token) {
          bru.setEnvVar("token", data.access_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
